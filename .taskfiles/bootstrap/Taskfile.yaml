---
version: '3'

vars:
  RANDOM_CONTROLLER:
    sh: talosctl config info --output json | jq --raw-output '.endpoints[]' | shuf -n 1

tasks:

  talos:
    desc: Bootstrap Talos
    prompt: Bootstrap Talos ...?
    cmds:
      - talosctl --nodes {{.RANDOM_CONTROLLER}} bootstrap
      - talosctl --nodes {{.RANDOM_CONTROLLER}} kubeconfig --force {{.KUBERNETES_DIR}}
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.RANDOM_CONTROLLER}} get machineconfig
      - which jq talosctl

  apps:
    desc: Bootstrap Kubernetes Apps  [BWS_ACCESS_TOKEN=required]
    prompt: Bootstrap Kubernetes Apps ...?
    cmds:
      - kubectl config set-cluster {{.CONTEXT}} --server https://{{.RANDOM_CONTROLLER}}:6443
      - defer: talosctl --nodes {{.RANDOM_CONTROLLER}} kubeconfig --force {{.KUBERNETES_DIR}}
      - kubectl wait nodes --for=condition=Ready=False --all --timeout=10m
      - task: kustomize 
      - task: helmfile
    vars:
      CONTEXT:
        sh: talosctl config info --output json | jq --raw-output '.context'
    requires:
      vars: [BWS_ACCESS_TOKEN]
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.RANDOM_CONTROLLER}} get machineconfig
      - which jq kubectl bws talosctl

  kustomize:
    internal: true
    desc: Apply kustomize [BWS_ACCESS_TOKEN=required]
    cmd: |-
      kustomize build {{.BOOTSTRAP_DIR}}/kustomize/apps | minijinja-cli - | kubectl apply --server-side --force-conflicts -f -
    env:
      BOT_APP_ID:
        sh: bws secret get 24a40e61-9205-4128-a0fb-2214684b3328 | jq -r '.value | fromjson .BOT_APP_ID'
      BOT_APP_PRIVATE_KEY:
        sh: bws secret get 24a40e61-9205-4128-a0fb-2214684b3328 | jq -r '.value | fromjson .BOT_APP_PRIVATE_KEY'
      BOT_APP_INSTALLATION_ID:
        sh: bws secret get 24a40e61-9205-4128-a0fb-2214684b3328 | jq -r '.value | fromjson .BOT_APP_INSTALLATION_ID'

    preconditions:
      - test -d {{.BOOTSTRAP_DIR}}/kustomize/apps
      - bws project get 8cfc9211-d42e-45af-a73f-1e52d95c417b
      - which bws minijinja-cli kubectl

  helmfile:
    internal: true
    cmds:
      - |
        helmfile --file {{.BOOTSTRAP_DIR}}/helmfile/crds.yaml template --quiet \
          | yq ea -e 'select(.kind == "CustomResourceDefinition")' \
          | kubectl apply --server-side --field-manager bootstrap --force-conflicts --filename -
      - helmfile --file {{.BOOTSTRAP_DIR}}/helmfile/apps.yaml sync --hide-notes
    preconditions:
      - test -f {{.BOOTSTRAP_DIR}}/helmfile/crds.yaml
      - test -f {{.BOOTSTRAP_DIR}}/helmfile/apps.yaml
      - which helmfile kubectl yq
