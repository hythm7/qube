---
version: '3'

vars:
  NODES:
    sh: talosctl config info --output json | jq --join-output '[.nodes[]] | join(",")'
  RANDOM_CONTROLLER:
    sh: talosctl config info --output json | jq --raw-output '.endpoints[]' | shuf -n 1

tasks:

  apply-node:
    desc: Apply Talos config to a node [BWS_ACCESS_TOKEN=required] [NODE=required] [PROJECT_ID={{.PROJECT_ID}}]  [TALOS_SECRET_ID={{.TALOS_SECRET_ID}}] [MODE={{.MODE}}]
    cmd: |-
       bws --access-token {{ .BWS_ACCESS_TOKEN }} secret get {{ .TALOS_SECRET_ID }} | jq -r '.value' \
        | minijinja-cli {{.TALOS_DIR}}/machineconfig.yaml.j2  - --format json \
        | talosctl --nodes {{.NODE}} apply-config \
          --mode {{.MODE}} \
          --config-patch @{{.TALOS_DIR}}/networking.yaml \
          --config-patch @{{.TALOS_DIR}}/nodes/{{.NODE}}.yaml.j2 \
          --file /dev/stdin {{if .INSECURE}}--insecure{{end}}
    vars:
      PROJECT_ID:      '{{.PROJECT_ID      | default "8cfc9211-d42e-45af-a73f-1e52d95c417b"}}'
      TALOS_SECRET_ID: '{{.TALOS_SECRET_ID | default "5d74df36-943a-4214-be04-22e23a74e781"}}'
      MODE:            '{{.MODE            | default "auto"}}'
      INSECURE:
        sh: talosctl version --nodes {{.NODE}} &> /dev/null || echo true
    env:
      CONTROLPLANE: true
        # TODO: Need fix
        #sh: minijinja-cli {{.TALOS_DIR}}/nodes/{{.NODE}}.yaml.j2 \
        #  | yq -e 'select(.machine) | (.machine.type == "controlplane") // ""'
      SCHEMATIC:
        sh: task --silent talos:generate-schematic
    requires:
      vars: [BWS_ACCESS_TOKEN, NODE]
    preconditions:
      - talosctl config info
      - test -f {{.TALOS_DIR}}/machineconfig.yaml.j2
      - test -f {{.TALOS_DIR}}/networking.yaml
      - test -f {{.TALOS_DIR}}/nodes/{{.NODE}}.yaml.j2
      - bws project get {{.PROJECT_ID}}
      - which bws minijinja-cli talosctl

  upgrade-node:
    desc: Upgrade Talos on a single node [NODE=required]
    cmd: talosctl --nodes {{.NODE}} upgrade --image={{.TALOS_IMAGE}} --timeout=10m
    vars:
      TALOS_IMAGE:
        sh: |-
          talosctl --nodes {{.NODE}} get machineconfig --output=jsonpath='{.spec}' \
            | yq '.machine.install.image | select(. != null)'
    requires:
      vars: [NODE]
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODE}} get machineconfig
      - which minijinja-cli talosctl yq

  reboot-node:
    desc: Reboot Talos on a single node [NODE=required] [MODE={{.MODE}}]
    cmd: talosctl --nodes {{.NODE}} reboot --mode={{.MODE}}
    vars:
      MODE: '{{.MODE | default "default"}}'
    requires:
      vars: [NODE]
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODE}} get machineconfig
      - which talosctl

  shutdown-cluster:
    desc: Shutdown Talos across the whole cluster
    prompt: Shutdown the Talos cluster ... continue?
    cmd: talosctl --nodes {{.NODES}} shutdown --force
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODES}} get machineconfig
      - which jq talosctl

  reset-node:
    desc: Reset Talos on a single node [NODE=required]
    prompt: Reset Talos node '{{.NODE}}' ... continue?
    cmd: talosctl --nodes {{.NODE}} reset --reboot=true --graceful=false
    requires:
      vars: [NODE]
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODE}} get machineconfig
      - which talosctl

  reset-cluster:
    desc: Reset Talos across the whole cluster
    prompt: Reset the Talos cluster ... continue?
    cmd: talosctl --nodes {{.NODES}} reset --reboot=true --graceful=false
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.NODES}} get machineconfig
      - which jq talosctl

  generate-kubeconfig:
    desc: Generate the kubeconfig for a Talos cluster
    cmd: talosctl kubeconfig --nodes {{.RANDOM_CONTROLLER}} --force {{.KUBERNETES_DIR}}
    preconditions:
      - talosctl config info
      - talosctl --nodes {{.RANDOM_CONTROLLER}} get machineconfig
      - which jq talosctl

  generate-iso:
    desc: Generate a Talos ISO for a specific version [VERSION=required]
    cmd: |-
      curl -L -o {{.TALOS_DIR}}/talos-{{.VERSION}}.iso \
        https://factory.talos.dev/image/{{.TALOS_SCHEMATIC}}/{{.VERSION}}/metal-amd64.iso
    vars:
      SCHEMATIC:
        sh: task --silent talos:generate-schematic
    requires:
      vars: [VERSION]
    preconditions:
      - which curl task

  generate-schematic:
    desc: Generate a Talos schematic
    cmd: |-
      minijinja-cli {{.TALOS_DIR}}/schematic.yaml.j2 \
        | curl --silent -X POST --data-binary @- https://factory.talos.dev/schematics \
        | jq --raw-output '.id'
    env:
      CONFIG_EARLY:
        sh: zstd -c {{.TALOS_DIR}}/networking.yaml | base64 -w0
    preconditions:
      - test -f {{.TALOS_DIR}}/schematic.yaml.j2
      - test -f {{.TALOS_DIR}}/networking.yaml
      - which base64 curl jq minijinja-cli zstd
