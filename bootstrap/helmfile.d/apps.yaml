---
helmDefaults:
  args:
    - --force-conflicts
  cleanupOnFail: true
  wait: true
  waitForJobs: true

releases:
  - name: cilium
    namespace: kube-system
    chart: oci://quay.io/cilium/charts/cilium
    version: 1.19.3
    values:
      - ./templates/values.yaml.gotmpl
    hooks:
      - # Wait for CRDs to be available
        command: kubectl
        args:
          - wait
          - --for=create
          - crd/ciliumbgpadvertisements.cilium.io
          - crd/ciliumbgpclusterconfigs.cilium.io
          - crd/ciliumbgppeerconfigs.cilium.io
          - crd/ciliumloadbalancerippools.cilium.io
          - --timeout=2m
        events:
          - postsync
        showlogs: true
      - # Apply Cilium Resources
        command: kubectl
        args:
          - apply
          - --field-manager=kustomize-controller
          - --namespace={{ .Release.Namespace }}
          - --kustomize=../../kubernetes/apps/{{ .Release.Namespace }}/{{ .Release.Name }}/config
          - --server-side
        events:
          - postsync
        showlogs: true

  - name: coredns
    namespace: kube-system
    chart: oci://ghcr.io/coredns/charts/coredns
    version: 1.45.2
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - kube-system/cilium

  - name: cert-manager
    namespace: cert-manager
    chart: oci://quay.io/jetstack/charts/cert-manager
    version: v1.20.2
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - kube-system/coredns
    hooks:
      - # Apply cert-manager ClusterIssuers (needed before bitwarden TLS cert can be issued)
        command: kubectl
        args:
          - apply
          - --namespace=cert-manager
          - --server-side
          - --field-manager=kustomize-controller
          - --filename=../../kubernetes/apps/{{ .Release.Namespace }}/{{ .Release.Name }}/issuers/clusterissuer.yaml
        events:
          - postsync
        showlogs: true
      - # Apply bitwarden SDK TLS certificate (issued by home-ca, required by ClusterSecretStore)
        command: kubectl
        args:
          - apply
          - --namespace=external-secrets
          - --server-side
          - --field-manager=kustomize-controller
          - --filename=../../kubernetes/apps/external-secrets/external-secrets/app/certificate.yaml
        events:
          - postsync
        showlogs: true

  - name: external-secrets
    namespace: external-secrets
    chart: oci://ghcr.io/external-secrets/charts/external-secrets
    version: 2.4.1
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - cert-manager/cert-manager
    hooks:
      - # Apply ClusterSecretStore (bitwarden secrets manager)
        command: kubectl
        args:
          - apply
          - --field-manager=kustomize-controller
          - --namespace={{ .Release.Namespace }}
          - --filename=../../kubernetes/apps/{{ .Release.Namespace }}/{{ .Release.Name }}/app/clustersecretstore.yaml
          - --server-side
        events:
          - postsync
        showlogs: true

  - name: flux-operator
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.49.0
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - external-secrets/external-secrets

  - name: flux-instance
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    version: 0.49.0
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - flux-system/flux-operator
