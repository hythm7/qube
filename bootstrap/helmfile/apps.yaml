---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# Bootstraps core applications that provide a minimal runtime base for the
# cluster. These releases are installed first so the cluster has the resources
# Flux needs before its own reconciliation begins.
#
# After this bootstrap phase, Flux is ready to take over management of the
# application stack and continue reconciling downstream state.

bases:
  - default.yaml

defaultInherit: default

helmDefaults:
  cleanupOnFail: true
  forceConflicts: true
  wait: true
  waitForJobs: true

releases:
  - name: cilium
    namespace: kube-system
    hooks:
      - # Wait for CRDs to be available
        command: kubectl
        args:
          - wait
          - --for=create
          - crd/ciliumbgpadvertisements.cilium.io
          - crd/ciliumbgpclusterconfigs.cilium.io
          - crd/ciliumbgppeerconfigs.cilium.io
          - crd/ciliumloadbalancerippools.cilium.io
          - --timeout=2m
        events:
          - postsync
        showlogs: true
      - # Advertise Kubernetes VIP
        command: kubectl
        args:
          - apply
          - --field-manager=kustomize-controller
          - --namespace={{ .Release.Namespace }}
          - --kustomize=../../kubernetes/apps/{{ .Release.Namespace }}/{{ .Release.Name }}/config
          - --server-side
        events:
          - postsync
        showlogs: true

  - name: coredns
    namespace: kube-system
    needs:
      - kube-system/cilium

  - name: cert-manager
    namespace: cert-manager
    needs:
      - kube-system/coredns
    hooks:
      - # Apply cert-manager ClusterIssuers (needed before bitwarden TLS cert can be issued)
        command: kubectl
        args:
          - apply
          - --namespace=cert-manager
          - --server-side
          - --field-manager=kustomize-controller
          - --filename=../../kubernetes/apps/{{ .Release.Namespace }}/{{ .Release.Name }}/issuers/clusterissuer.yaml
        events:
          - postsync
        showlogs: true
      - # Apply bitwarden SDK TLS certificate (issued by home-ca, required by ClusterSecretStore)
        command: kubectl
        args:
          - apply
          - --namespace=external-secrets
          - --server-side
          - --field-manager=kustomize-controller
          - --filename=../../kubernetes/apps/external-secrets/external-secrets/stores/certificate.yaml
        events:
          - postsync
        showlogs: true

  - name: external-secrets
    namespace: external-secrets
    needs:
      - cert-manager/cert-manager
    hooks:
      - # Apply secret stores (bitwarden secrets manager + SDK TLS cert)
        command: kubectl
        args:
          - apply
          - --field-manager=kustomize-controller
          - --namespace={{ .Release.Namespace }}
          - --kustomize=../../kubernetes/apps/{{ .Release.Namespace }}/{{ .Release.Name }}/stores
          - --server-side
        events:
          - postsync
        showlogs: true

  - name: flux-operator
    namespace: flux-system
    needs:
      - external-secrets/external-secrets

  - name: flux-instance
    namespace: flux-system
    needs:
      - flux-system/flux-operator
