---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: listmonk
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      listmonk:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18"
            envFrom:
              - secretRef:
                  name: listmonk-initdb-secret
          02-install:
            image:
              repository: listmonk/listmonk
              tag: v4.1.0
            command: ["./listmonk", "--install", "--idempotent", "--yes"]
            env:
              LISTMONK_db__host:
                valueFrom:
                  secretKeyRef:
                    name: listmonk-pguser-secret
                    key: host
              LISTMONK_db__port: "5432"
              LISTMONK_db__user:
                valueFrom:
                  secretKeyRef:
                    name: listmonk-pguser-secret
                    key: user
              LISTMONK_db__password:
                valueFrom:
                  secretKeyRef:
                    name: listmonk-pguser-secret
                    key: password
              LISTMONK_db__database: listmonk
            envFrom:
              - secretRef:
                  name: listmonk-secret
        containers:
          app:
            image:
              repository: listmonk/listmonk
              tag: v4.1.0
            env:
              LISTMONK_app__address: "0.0.0.0:9000"
              LISTMONK_app__root_url: https://listmonk.ahla.dev
              LISTMONK_db__host:
                valueFrom:
                  secretKeyRef:
                    name: listmonk-pguser-secret
                    key: host
              LISTMONK_db__port: "5432"
              LISTMONK_db__user:
                valueFrom:
                  secretKeyRef:
                    name: listmonk-pguser-secret
                    key: user
              LISTMONK_db__password:
                valueFrom:
                  secretKeyRef:
                    name: listmonk-pguser-secret
                    key: password
              LISTMONK_db__database: listmonk
              LISTMONK_smtp__host: smtp-relay.networking.svc.cluster.local
              LISTMONK_smtp__port: "25"
              LISTMONK_smtp__auth_protocol: ""
              LISTMONK_smtp__tls_type: none
              LISTMONK_smtp__from_email: support@ahla.dev
            envFrom:
              - secretRef:
                  name: listmonk-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 9000
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 256Mi
    persistence:
      uploads:
        existingClaim: listmonk
        globalMounts:
          - path: /listmonk/uploads
    service:
      app:
        controller: listmonk
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://listmonk.ahla.dev/api/health
        hostnames:
          - listmonk.ahla.dev
        parentRefs:
          - name: envoy-external
            namespace: networking
