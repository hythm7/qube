---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: umami
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      umami:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/umami-software/umami
              tag: postgresql-latest
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: umami-pguser-secret
                    key: uri
            envFrom:
              - secretRef:
                  name: umami-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/heartbeat
                    port: &port 3000
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 512Mi
    service:
      app:
        controller: umami
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://analytics.ahla.dev/api/heartbeat
        hostnames:
          - analytics.ahla.dev
        parentRefs:
          - name: envoy-external
            namespace: networking
