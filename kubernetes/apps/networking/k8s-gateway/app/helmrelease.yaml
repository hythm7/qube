---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  interval: 1h
  values:
    domain: ahla.show
    ttl: 1
    service:
      type: LoadBalancer
      port: 53
      annotations:
        lbipam.cilium.io/ips: 192.168.20.253
      externalTrafficPolicy: Cluster
    watchedResources:
      - Ingress
      - Service
      - HTTPRoute
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
