---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ${DOMAIN_MAIN/./-}-tls
spec:
  dnsNames:
    - "${DOMAIN_MAIN}"
    - "*.${DOMAIN_MAIN}"
  duration: 160h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretName: ${DOMAIN_MAIN/./-}-tls-secret
  usages:
    - digital signature

---
apiVersion: cert-manager.io/v1
