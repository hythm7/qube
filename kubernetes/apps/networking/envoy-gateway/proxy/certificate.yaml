---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ${DOMAIN/./-}-tls
spec:
  dnsNames:
    - "${DOMAIN}"
    - "*.${DOMAIN}"
    - "hythm.net"
    - "*.hythm.net"
  duration: 160h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretName: ${DOMAIN/./-}-tls-secret
  usages:
    - digital signature

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hythm-net-tls
spec:
  dnsNames:
    - "hythm.net"
    - "*.hythm.net"
  duration: 160h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretName: hythm-net-tls-secret
  usages:
    - digital signature
