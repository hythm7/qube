spec:
  dnsNames:
    - "${DOMAIN_BACKUP}"
    - "*.${DOMAIN_BACKUP}"
  duration: 160h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretName: ${DOMAIN_BACKUP/./-}-tls-secret
  usages:
    - digital signature
