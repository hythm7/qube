---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ahla-show
spec:
  dnsNames:
    - ahla.show
    - "*.ahla.show"
  duration: 160h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretName: ahla-show-tls
  usages:
    - digital signature
