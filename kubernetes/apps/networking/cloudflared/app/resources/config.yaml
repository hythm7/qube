---
ingress:
  - hostname: "ahla.show"
    service: https://envoy-external.networking.svc.cluster.local
    originRequest:
      http2Origin: true
      originServerName: "external.ahla.show"
  - hostname: "*.ahla.show"
    service: https://envoy-external.networking.svc.cluster.local
    originRequest:
      http2Origin: true
      originServerName: "external.ahla.show"
  - service: http_status:404
