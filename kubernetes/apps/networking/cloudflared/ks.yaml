---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflared
spec:
  interval: 1h
  path: ./kubernetes/apps/networking/cloudflared/app
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cloudflare-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: networking
  wait: false
