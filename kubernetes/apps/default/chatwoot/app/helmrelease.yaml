---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chatwoot
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      web:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: "18"
            envFrom:
              - secretRef:
                  name: chatwoot-initdb-secret
          02-migrate:
            image:
              repository: chatwoot/chatwoot
              tag: latest
            command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
            env:
              RAILS_ENV: production
              REDIS_URL: redis://chatwoot-dragonfly.default.svc.cluster.local:6379
              POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    name: chatwoot-pguser-secret
                    key: host
              POSTGRES_PORT:
                valueFrom:
                  secretKeyRef:
                    name: chatwoot-pguser-secret
                    key: port
              POSTGRES_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: chatwoot-pguser-secret
                    key: user
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: chatwoot-pguser-secret
                    key: password
              POSTGRES_DATABASE:
                valueFrom:
                  secretKeyRef:
                    name: chatwoot-pguser-secret
                    key: db
            envFrom:
              - secretRef:
                  name: chatwoot-secret
        containers:
          app:
            image:
              repository: chatwoot/chatwoot
              tag: latest
            command: ["bundle", "exec", "rails", "s", "-b", "0.0.0.0", "-p", "3000"]
            env:
              RAILS_ENV: production
              NODE_ENV: production
              RAILS_LOG_TO_STDOUT: "true"
              RAILS_SERVE_STATIC_FILES: "true"
              INSTALLATION_ENV: docker
              FRONTEND_URL: https://support.ahla.dev
              INSTALLATION_NAME: Ahla
              DEFAULT_LOCALE: en
              ACTIVE_STORAGE_SERVICE: local
              REDIS_URL: redis://chatwoot-dragonfly.default.svc.cluster.local:6379
              MAILER_SENDER_EMAIL: support@ahla.dev
              SMTP_ADDRESS: smtp-relay.default.svc.cluster.local
              SMTP_PORT: "25"
              SMTP_AUTHENTICATION: plain
              SMTP_ENABLE_STARTTLS_AUTO: "false"
              POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    name: chatwoot-pguser-secret
                    key: host
              POSTGRES_PORT:
                valueFrom:
                  secretKeyRef:
                    name: chatwoot-pguser-secret
                    key: port
              POSTGRES_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: chatwoot-pguser-secret
                    key: user
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: chatwoot-pguser-secret
                    key: password
              POSTGRES_DATABASE:
                valueFrom:
                  secretKeyRef:
                    name: chatwoot-pguser-secret
                    key: db
            envFrom:
              - secretRef:
                  name: chatwoot-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /auth/sign_in
                    port: &port 3000
                  initialDelaySeconds: 60
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 1Gi
      worker:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: chatwoot/chatwoot
              tag: latest
            command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
            env:
              RAILS_ENV: production
              FRONTEND_URL: https://support.ahla.dev
              ACTIVE_STORAGE_SERVICE: local
              REDIS_URL: redis://chatwoot-dragonfly.default.svc.cluster.local:6379
              MAILER_SENDER_EMAIL: support@ahla.dev
              SMTP_ADDRESS: smtp-relay.default.svc.cluster.local
              SMTP_PORT: "25"
              SMTP_AUTHENTICATION: plain
              SMTP_ENABLE_STARTTLS_AUTO: "false"
              POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    name: chatwoot-pguser-secret
                    key: host
              POSTGRES_PORT:
                valueFrom:
                  secretKeyRef:
                    name: chatwoot-pguser-secret
                    key: port
              POSTGRES_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: chatwoot-pguser-secret
                    key: user
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: chatwoot-pguser-secret
                    key: password
              POSTGRES_DATABASE:
                valueFrom:
                  secretKeyRef:
                    name: chatwoot-pguser-secret
                    key: db
            envFrom:
              - secretRef:
                  name: chatwoot-secret
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 1Gi
    persistence:
      storage:
        existingClaim: chatwoot
        globalMounts:
          - path: /app/storage
    service:
      app:
        controller: web
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://support.ahla.dev/auth/sign_in
        hostnames:
          - support.ahla.dev
        parentRefs:
          - name: envoy-external
            namespace: networking
