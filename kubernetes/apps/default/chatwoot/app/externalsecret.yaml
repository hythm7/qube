---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chatwoot
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: chatwoot-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY_BASE: "{{ .chatwoot_secret_key_base }}"
  dataFrom:
    - extract:
        key: chatwoot
