---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/kubernetesupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    version: v1.36.1
  # CRITICAL FOR SINGLE-NODE:
  policy:
    force: true          # Moves the force override flag inside the policy block
  node:
    maxParallel: 1       # Bypass multi-node sequencing:
