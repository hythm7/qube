---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name bitwarden-secrets-manager
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: *name
  target:
    name: *name
    template:
      data:
        # this can NOT end in a newline or it doesn't work
        token: '{{ .BITWARDEN_AHLA_TOKEN }}'
  dataFrom:
    - extract:
        key: ahlatoken
