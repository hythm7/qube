---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name bitwarden-secrets-manager
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: *name
  target:
    name: *name
    # Orphan: this Secret is the store's own credential. If the ExternalSecret is ever
    # pruned/re-created (as in the 2026-07-30 stores split), GC must not delete it,
    # or the store can never re-authenticate to recreate it.
    creationPolicy: Orphan
    template:
      data:
        # this can NOT end in a newline or it doesn't work
        token: '{{ .BITWARDEN_QUBE_TOKEN }}'
  dataFrom:
    - extract:
        key: qubetoken
