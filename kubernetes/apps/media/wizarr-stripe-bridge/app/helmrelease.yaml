---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wizarr-stripe-bridge
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 1h
  values:
    controllers:
      reconcile:
        type: cronjob
        cronjob:
          schedule: "0 */4 * * *"
          timeZone: America/New_York
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
        containers:
          app:
            image:
              repository: ghcr.io/ahlanet/wizarr-stripe-bridge
              tag: latest
            command: ["raku", "-I.", "bin/wizarr-bridge", "reconcile"]
            env:
              WIZARR_BASE_URL: http://wizarr.media.svc.cluster.local:5690
              JELLYFIN_URL: https://play.${DOMAIN_MAIN}
              JELLYFIN_API_URL: http://jellyfin.media.svc.cluster.local:8096
              SEERR_API_URL: http://seerr.media.svc.cluster.local
              RESEND_FROM_EMAIL: support@ahla.dev
              BRIDGE_PUBLIC_URL: https://ahla.dev
              STRIPE_PAYMENT_LINK_MONTHLY: https://buy.stripe.com/test_3cIdR8gEqcnuaFKd7y6c005
              STRIPE_PAYMENT_LINK_QUARTERLY: https://buy.stripe.com/test_28E14m1Jwafm9BGd7y6c006
              STRIPE_PAYMENT_LINK_YEARLY: https://buy.stripe.com/test_fZu5kC1Jw9bi4hm3wY6c007
              STRIPE_PAYMENT_LINK_PREMIUM_MONTHLY: https://buy.stripe.com/test_fZucN45ZMbjq4hmd7y6c008
              STRIPE_PAYMENT_LINK_PREMIUM_QUARTERLY: https://buy.stripe.com/test_28EdR873QcnubJO7Ne6c009
              STRIPE_PAYMENT_LINK_PREMIUM_YEARLY: https://buy.stripe.com/test_5kQcN41Jw3QY15ac3u6c00a
            envFrom:
              - secretRef:
                  name: wizarr-stripe-bridge-secret
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
      wizarr-stripe-bridge:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/ahlanet/wizarr-stripe-bridge
              tag: latest
            env:
              TZ: America/New_York
              BRIDGE_HOST: 0.0.0.0
              BRIDGE_PORT: &port 80
              WIZARR_BASE_URL: http://wizarr.media.svc.cluster.local:5690
              JELLYFIN_URL: https://play.${DOMAIN_MAIN}
              JELLYFIN_API_URL: http://jellyfin.media.svc.cluster.local:8096
              SEERR_API_URL: http://seerr.media.svc.cluster.local
              RESEND_FROM_EMAIL: support@ahla.dev
              BRIDGE_PUBLIC_URL: https://ahla.dev
              ABUSE_DETECTION: "true"
              STRIPE_PAYMENT_LINK_MONTHLY: https://buy.stripe.com/test_3cIdR8gEqcnuaFKd7y6c005
              STRIPE_PAYMENT_LINK_QUARTERLY: https://buy.stripe.com/test_28E14m1Jwafm9BGd7y6c006
              STRIPE_PAYMENT_LINK_YEARLY: https://buy.stripe.com/test_fZu5kC1Jw9bi4hm3wY6c007
              STRIPE_PAYMENT_LINK_PREMIUM_MONTHLY: https://buy.stripe.com/test_fZucN45ZMbjq4hmd7y6c008
              STRIPE_PAYMENT_LINK_PREMIUM_QUARTERLY: https://buy.stripe.com/test_28EdR873QcnubJO7Ne6c009
              STRIPE_PAYMENT_LINK_PREMIUM_YEARLY: https://buy.stripe.com/test_5kQcN41Jw3QY15ac3u6c00a
            envFrom:
              - secretRef:
                  name: wizarr-stripe-bridge-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      app:
        controller: wizarr-stripe-bridge
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: bridge
            url: https://bridge.ahla.dev/health
        hostnames:
          - bridge.ahla.dev
        parentRefs:
          - name: envoy-external
            namespace: networking
