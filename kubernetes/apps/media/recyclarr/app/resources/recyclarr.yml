---
# ─────────────────────────────────────────────────────────────────────────────
# Recyclarr configuration — synced from TRaSH Guides (v8 custom_format_groups)
#
# Tiered instances:
#   radarr     → 1080p movies  → HD Bluray + WEB
#   radarr-4k  → 4K movies      → [SQP] SQP-1 (2160p)
#   sonarr     → 1080p shows    → WEB-1080p
#   sonarr-4k  → 4K shows        → WEB-2160p (Combined)
#
# Quality strategy: x265 with HDR/DV allowed (GPU transcodes for incompatible
# clients), unwanted formats blocked, scores from each profile's score_set.
# ─────────────────────────────────────────────────────────────────────────────

radarr:
  radarr:
    base_url: http://radarr.media.svc.cluster.local
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      folder: plex-imdb
      movie:
        rename: true
        standard: plex-imdb

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD
          select:
            - dc98083864ea246d05a42df0d05f81cc  # x265 (HD) — allow with HDR/DV
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
          select:
            - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
            - cae4ca30163749b891686f95532519bd  # AV1
            - b6832f586342ef70d9c128d40c07b872  # Bad Dual Groups
            - cc444569854e9de0b084ab2b8b1532b2  # Black and White Editions
            - ed38b889b31be83fda192888e2286d83  # BR-DISK
            - 0a3f082873eb454bde444150b70253cc  # Extras
            - e6886871085226c3da1830830146846c  # Generated Dynamic HDR
            - 90a6f9a284dff5103f6346090e6280c8  # LQ
            - e204b80c87be9497a8a6eaff48f72905  # LQ (Release Title)
            - 712d74cd88bceb883ee32f773656b1f5  # Sing-Along Versions
            - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled

  radarr-4k:
    base_url: http://radarr-4k.media.svc.cluster.local
    api_key: !env_var RADARR_4K_API_KEY
    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      folder: plex-imdb
      movie:
        rename: true
        standard: plex-imdb

    quality_definition:
      type: sqp-streaming

    quality_profiles:
      - trash_id: 5128baeb2b081b72126bc8482b2a86a0  # [SQP] SQP-1 (2160p)
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: 15b1cf0b6f1a1493856a4355907affee  # [Unwanted] Unwanted Formats SQP
          select:
            - b6832f586342ef70d9c128d40c07b872  # Bad Dual Groups
            - cc444569854e9de0b084ab2b8b1532b2  # Black and White Editions
            - e6886871085226c3da1830830146846c  # Generated Dynamic HDR
            - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled

sonarr:
  sonarr:
    base_url: http://sonarr.media.svc.cluster.local
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      series: plex-imdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
          select:
            - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD) — allow with HDR/DV
        - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
          select:
            - 218e93e5702f44a68ad9e3c6ba87d2f0  # HD Streaming Boost
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
          select:
            - 15a05bc7c1a36e2b57fd628f8977e2fc  # AV1
            - 32b367365729d530ca1c124a0b180c64  # Bad Dual Groups
            - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
            - 6f808933a71bd9666531610cb8c059cc  # BR-DISK (BTN)
            - fbcb31d8dabd2a319072b84fc0b7249c  # Extras
            - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
            - e2315f990da2e2cbfc9fa5b7a6fcfe48  # LQ (Release Title)
            - 23297a736ca77c0fc8e70f8edd7ee56c  # Upscaled

  sonarr-4k:
    base_url: http://sonarr-4k.media.svc.cluster.local
    api_key: !env_var SONARR_4K_API_KEY
    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      series: plex-imdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: e3f37512790f00d0e89e54fe5e790d1c  # [Optional] Golden Rule UHD
          select:
            - 9b64dff695c2115facf1b6ea59c9bd07  # x265 (no HDR/DV) — block on UHD
        - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
          select:
            - 43b3cf48cb385cd3eac608ee6bca7f09  # UHD Streaming Boost
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
          select:
            - 15a05bc7c1a36e2b57fd628f8977e2fc  # AV1
            - 32b367365729d530ca1c124a0b180c64  # Bad Dual Groups
            - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
            - 6f808933a71bd9666531610cb8c059cc  # BR-DISK (BTN)
            - fbcb31d8dabd2a319072b84fc0b7249c  # Extras
            - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
            - e2315f990da2e2cbfc9fa5b7a6fcfe48  # LQ (Release Title)
            - 23297a736ca77c0fc8e70f8edd7ee56c  # Upscaled
