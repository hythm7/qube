---
# ─────────────────────────────────────────────────────────────────────────────
# Recyclarr configuration — synced from TRaSH Guides
#
# Radarr:  HD Bluray + WEB (1080p)  +  SQP-1 (2160p)
# Sonarr:  WEB-1080p               +  WEB-2160p
#
# Philosophy:
#   - Prefer H.265 (x265) releases that carry HDR/DV — same visual quality,
#     ~40% smaller files, GPU handles transcoding for incompatible clients.
#   - Block x265 releases WITHOUT HDR (no storage saving worth the quality trade-off).
#   - Prefer HDR10+ and Dolby Vision on 4K profiles.
#   - Block SDR on 4K (no point storing 4K without HDR).
#   - Block known bad/obfuscated release groups.
# ─────────────────────────────────────────────────────────────────────────────

sonarr:
  sonarr:
    base_url: http://sonarr.media.svc.cluster.local
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      series: plex-imdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    include:
      # Quality sizes
      - template: sonarr-quality-definition-series

      # Quality profiles — both 1080p and 4K managed from one instance
      - template: sonarr-v4-quality-profile-web-1080p
      - template: sonarr-v4-quality-profile-web-2160p

      # Custom format bundles from TRaSH
      - template: sonarr-v4-custom-formats-web-1080p
      - template: sonarr-v4-custom-formats-web-2160p

    custom_formats:
      # ── x265 / H.265 ──────────────────────────────────────────────────────
      # Allow x265 releases that carry HDR or Dolby Vision (score 0 = neutral).
      # These direct-play on modern clients; GPU transcodes for legacy devices.
      - trash_ids:
          - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD) — has HDR/DV
        assign_scores_to:
          - name: WEB-1080p
            score: 0
          - name: WEB-2160p
            score: 0

      # Hard-block x265 without any HDR — worst of both worlds (no HDR benefit,
      # more transcoding for clients that can't play x265).
      - trash_ids:
          - 9b64dff695c2115facf1b6ea59c9bd07 # x265 (no HDR/DV)
        assign_scores_to:
          - name: WEB-1080p
            score: -10000
          - name: WEB-2160p
            score: -10000

      # ── Bad release groups ────────────────────────────────────────────────
      - trash_ids:
          - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
          - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
          - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
          - 06d66ab109d4d2eddb2794d21526d140 # Retags
          - 1b3994c551cbb92a2c781af061f4ab44 # Scene
        assign_scores_to:
          - name: WEB-1080p
          - name: WEB-2160p

      # ── 4K HDR preferences ────────────────────────────────────────────────
      # Prefer HDR10+ and Dolby Vision releases when available.
      - trash_ids:
          - 0c4b99df9206d2cfac3c05ab897dd62a # HDR10+ Boost
          - 7c3a61a9c6cb04f52f1544be6d44a026 # DV Boost
        assign_scores_to:
          - name: WEB-2160p

      # Reject Dolby Vision releases with no HDR fallback — incompatible with
      # most non-Apple clients and will always transcode to SDR.
      - trash_ids:
          - 9b27ab6498ec0f31a3353992e19434ca # DV (w/o HDR fallback)
        assign_scores_to:
          - name: WEB-2160p

radarr:
  radarr:
    base_url: http://radarr.media.svc.cluster.local
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    media_naming:
      folder: plex-imdb
      movie:
        rename: true
        standard: plex-imdb

    include:
      # Quality sizes (sqp-streaming covers both WEB and Bluray encode tiers)
      - template: radarr-quality-definition-sqp-streaming

      # Quality profiles
      - template: radarr-quality-profile-hd-bluray-web
      - template: radarr-quality-profile-sqp-1-2160p-default

      # Custom format bundles from TRaSH
      - template: radarr-custom-formats-hd-bluray-web
      - template: radarr-custom-formats-sqp-1-2160p

    custom_formats:
      # ── x265 / H.265 ──────────────────────────────────────────────────────
      # Allow x265 with HDR/DV (neutral score = accepted alongside x264).
      - trash_ids:
          - dc98083864ea246d05a42df0d05f81cc # x265 (HD) — has HDR/DV
        assign_scores_to:
          - name: HD Bluray + WEB
            score: 0
          - name: SQP-1 (2160p)
            score: 0

      # Hard-block x265 without HDR on 1080p.
      - trash_ids:
          - 839bea857ed2c0a8e084f3cbdbd65ecb # x265 (no HDR/DV)
        assign_scores_to:
          - name: HD Bluray + WEB
            score: -10000

      # ── Bad release groups ────────────────────────────────────────────────
      - trash_ids:
          - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
          - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
          - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
          - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
          - f537cf427b64c38c8e36298f657e4828 # Scene
        assign_scores_to:
          - name: HD Bluray + WEB
          - name: SQP-1 (2160p)

      # ── 4K HDR preferences ────────────────────────────────────────────────
      - trash_ids:
          - b337d6812e06c200ec9a2d3cfa9d20a7 # DV Boost
          - caa37d0df9c348912df1fb1d88f9273a # HDR10+ Boost
        assign_scores_to:
          - name: SQP-1 (2160p)

      # Block all SDR on 4K — there is no value in 4K SDR.
      - trash_ids:
          - 9c38ebb7384dada637be8899efa68e6f # SDR
        assign_scores_to:
          - name: SQP-1 (2160p)
