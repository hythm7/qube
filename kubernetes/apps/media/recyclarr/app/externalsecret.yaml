---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: recyclarr-secret
  # The Bitwarden SM provider returns each secret's full JSON value and does
  # not support per-key `property` extraction, so we use dataFrom/extract
  # (which parses the JSON into individual keys) and `rewrite` to rename the
  # 4K instances' RADARR_API_KEY/SONARR_API_KEY — otherwise they collide with
  # the standard instances' identically-named keys.
  dataFrom:
    - extract:
        key: radarr
    - extract:
        key: sonarr
    - extract:
        key: radarr-4k
      rewrite:
        - regexp:
            source: "RADARR_API_KEY"
            target: "RADARR_4K_API_KEY"
    - extract:
        key: sonarr-4k
      rewrite:
        - regexp:
            source: "SONARR_API_KEY"
            target: "SONARR_4K_API_KEY"
