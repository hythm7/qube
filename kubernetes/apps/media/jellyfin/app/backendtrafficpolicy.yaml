---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: jellyfin
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: jellyfin
      sectionName: app
  requestBuffer:
    limit: 1Mi
  timeout:
    http:
      # long-lived streams and the /socket websocket must outlive the 4s gateway default
      connectionIdleTimeout: 300s
