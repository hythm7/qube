---
apiVersion: v1
kind: Service
metadata:
  name: kube-vip
  annotations:
    external-dns.alpha.kubernetes.io/hostname: kube.${DOMAIN_MAIN}
    lbipam.cilium.io/ips: 192.168.20.254
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    k8s-app: kube-apiserver
    tier: control-plane
  ports:
    - port: 6443
